<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Miku☆Miku☆Beam — Bennu Sample Return Mission Designer</title>
  <meta name="description" content="Design an OSIRIS-REx-class asteroid sample return mission within real mass, power, budget and orbital constraints, fly it through real NASA DONKI space weather, and compare with the real mission. NASA Space Apps Challenge 2026." />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='22' fill='%23222'/%3E%3Ccircle cx='32' cy='32' r='22' fill='none' stroke='%2339c5bb' stroke-width='4'/%3E%3Cpath d='M32 4l3 9h9l-7 6 3 9-8-6-8 6 3-9-7-6h9z' fill='%23ff5fa2'/%3E%3C/svg%3E" />
</head>
<body>
  <canvas id="gl"></canvas>
  <div id="vignette"></div>

  <div id="loading">
    <div class="load-logo">MIKU<span>☆</span>MIKU<span>☆</span>BEAM</div>
    <div class="load-sub">Loading NASA data &amp; building 3D assets…</div>
    <div class="load-bar"><i></i></div>
  </div>

  <header id="top">
    <div class="logo" data-go="briefing">MIKU<span>☆</span>MIKU<span>☆</span>BEAM</div>
    <nav id="stepper"></nav>
    <div id="topright">
      <button id="btn-sound" class="icon-btn" title="Sound on/off" aria-label="Toggle sound">🔊</button>
      <button id="btn-help" class="icon-btn" title="How to play" aria-label="How to play">?</button>
    </div>
  </header>
  <div id="elements" aria-label="Mission design elements"></div>

  <aside id="panel"></aside>

  <section id="console" class="collapsed">
    <button id="console-toggle">PHYSICS CONSOLE <b>▲</b></button>
    <div id="console-body"></div>
  </section>

  <div id="cine" class="hidden">
    <div class="bar top"></div><div class="bar bottom"></div>
    <div id="cine-caption"></div>
    <div id="cine-sub"></div>
    <button id="cine-skip">Skip ▶▶</button>
  </div>

  <div id="modal" class="hidden"><div id="modal-card"></div></div>
  <div id="toast"></div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
